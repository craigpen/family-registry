<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Registry mock-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<style>
:root {
  --bg: #FBF6EE; --surface: #FFFFFF; --surface-2: #F4ECE1; --ink: #2A211C; --ink-2: #6E6056;
  --line: #EADFD2; --accent: #CF4339; --accent-soft: #FBE3DF; --on-accent: #FFFFFF;
  --pine: #2F6E52; --pine-soft: #DCEFE4; --gold: #D9962B; --gold-soft: #FBEFD6; --heart: #E2495B;
  --shadow: 0 1px 2px rgba(60,40,30,.06), 0 6px 18px rgba(60,40,30,.08);
  --radius: 22px; --fs: 18px;
  /* Banner scenes */
  --xmas-1: #2F6E52; --xmas-2: #22543D; --snow: #F8F2E8; --cake: #FFFFFF;
  --hill-1: #B4D8C2; --hill-2: #D3E7D9; --sun: #F2C46D;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1615; --surface: #25201E; --surface-2: #2F2926; --ink: #F6EEE7; --ink-2: #BBAEA4;
    --line: #3B3431; --accent: #F06C60; --accent-soft: #4A2522; --on-accent: #1A1615;
    --pine: #74C59B; --pine-soft: #1F3A2D; --gold: #F0BE63; --gold-soft: #3F321B; --heart: #FF6F80;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
    --xmas-1: #1F4A37; --xmas-2: #15352A; --snow: #E6DDD0; --cake: #F1E7DB;
    --hill-1: #31594A; --hill-2: #283F35; --sun: #B98A3A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1615; --surface: #25201E; --surface-2: #2F2926; --ink: #F6EEE7; --ink-2: #BBAEA4;
  --line: #3B3431; --accent: #F06C60; --accent-soft: #4A2522; --on-accent: #1A1615;
  --pine: #74C59B; --pine-soft: #1F3A2D; --gold: #F0BE63; --gold-soft: #3F321B; --heart: #FF6F80;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35);
  --xmas-1: #1F4A37; --xmas-2: #15352A; --snow: #E6DDD0; --cake: #F1E7DB;
  --hill-1: #31594A; --hill-2: #283F35; --sun: #B98A3A;
  color-scheme: dark;
}
:root.large { --fs: 21px; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 600 var(--fs)/1.45 Nunito, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: Nunito, system-ui, sans-serif; font-weight: 800; margin: 0; letter-spacing: -.01em; }
.ph, .ph-bold, .ph-fill, .ph-duotone { line-height: 1; vertical-align: -0.125em; }

/* Mock-up controls (not part of the app) */
.demo { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; justify-content: center;
  padding: 6px 16px; font-size: 12px; color: var(--ink-2); border-bottom: 1px dashed var(--line); opacity: .85; }
.demo .tag { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
.demo .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.demo .seg button { padding: 3px 10px; font-size: 12px; }
.demo .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.demo select { font: inherit; font-size: 12px; color: inherit; background: var(--surface); border: 1px solid var(--line);
  border-radius: 99px; padding: 3px 8px; }
.demo .ico { width: 26px; height: 26px; border-radius: 99px; border: 1px solid var(--line); display: inline-grid; place-items: center; font-size: 14px; }
.demo .ico[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* App frame */
.app { max-width: 560px; margin: 0 auto; min-height: calc(100vh - 90px); position: relative; padding: 0 16px 120px; }
@media (min-width: 760px) {
  body { background: radial-gradient(1200px 600px at 50% -10%, var(--surface-2), var(--bg)); }
  .app { margin-top: 20px; margin-bottom: 40px; min-height: 820px; border-radius: 36px; background: var(--bg);
    box-shadow: var(--shadow), 0 0 0 1px var(--line); overflow: hidden; padding-bottom: 130px; }
}
.screen { animation: in .28s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(8px); } }

/* Header */
.top { display: flex; align-items: center; gap: 12px; padding: 22px 0 14px; }
.top h1 { font-size: 1.6em; flex: 1; }
.top .sub { color: var(--ink-2); font-size: .8em; }
.iconbtn { width: 48px; height: 48px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); font-size: 24px; }

/* Occasion banner */
.banner { position: relative; display: block; width: 100%; text-align: left; overflow: hidden; border-radius: var(--radius);
  min-height: 150px; margin-bottom: 18px; padding: 18px 18px 16px; color: var(--ink); animation: in .35s ease both; }
.banner .scene { position: absolute; inset: -6px -10px; width: calc(100% + 20px); height: calc(100% + 12px); pointer-events: none; will-change: transform; }
.banner .btext { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; max-width: 56%; gap: 2px; }
.banner .big { font: 800 2.5em/1 Nunito, system-ui, sans-serif; }
.banner .headline { font: 800 1.4em/1.15 Nunito, system-ui, sans-serif; margin-bottom: 2px; }
.banner strong { font-weight: 800; line-height: 1.25; }
.banner .small { font-size: .8em; opacity: .82; line-height: 1.3; }
.banner .go { margin-top: 8px; font-size: .8em; font-weight: 800; display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 12px; border-radius: 99px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.b-xmas { background: linear-gradient(135deg, var(--xmas-1), var(--xmas-2)); color: #fff; }
.b-xmas .go { background: rgba(255,255,255,.16); }
.b-bday { background: var(--gold-soft); }
.b-after { background: var(--accent-soft); }
.b-quiet { background: var(--surface-2); }
.flame { animation: flicker 1.4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes flicker { to { transform: scaleY(.82) scaleX(1.08); } }
.twinkle { animation: tw 2.4s ease-in-out infinite alternate; }
@keyframes tw { to { opacity: .15; } }
@media (prefers-reduced-motion: reduce) { .flame, .twinkle, .screen, .banner { animation: none; } }

/* Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; }
.chip { flex: none; padding: 9px 16px; border-radius: 99px; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; font-size: .85em; min-height: 44px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }

/* Faces grid */
.faces { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
@media (min-width: 420px) { .faces { grid-template-columns: repeat(3, 1fr); } }
.face { background: var(--surface); border-radius: var(--radius); padding: 18px 10px 14px; text-align: center; box-shadow: var(--shadow);
  position: relative; transition: transform .15s ease; }
.face:active { transform: scale(.97); }
.avatar { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 10px; display: grid; place-items: center;
  font: 800 30px Nunito, sans-serif; color: #fff; position: relative; }
.avatar.sm { width: 44px; height: 44px; font-size: 18px; margin: 0; }
.avatar.lg { width: 104px; height: 104px; font-size: 42px; }
.face .name { font-weight: 800; }
.face .meta { font-size: .72em; color: var(--ink-2); margin-top: 2px; }
.soon { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: .7em; padding: 3px 10px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); font-weight: 800; }
.dot { position: absolute; top: 14px; right: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); }

/* Person header */
.phead { text-align: center; padding: 8px 0 18px; }
.phead h1 { font-size: 1.7em; margin-top: 4px; }
.phead .meta { color: var(--ink-2); font-size: .85em; }
.back { position: absolute; left: 0; top: 22px; }
.note { background: var(--surface-2); border-radius: 16px; padding: 12px 14px; font-size: .82em; color: var(--ink-2); margin: 0 0 16px; display: flex; gap: 10px; align-items: flex-start; }
.note > i { font-size: 1.3em; flex: none; }
.section-title { font: 800 .75em Nunito; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 22px 4px 10px; display: flex; justify-content: space-between; align-items: center; }
.section-title span:first-child { display: inline-flex; align-items: center; gap: 6px; }
.section-title i { font-size: 1.4em; }

/* Item cards */
.items { display: grid; gap: 12px; }
.item { display: flex; gap: 14px; align-items: center; background: var(--surface); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); text-align: left; width: 100%; position: relative; }
/* Stand-ins for real product photos */
.photo { width: 76px; height: 76px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 40px; position: relative; overflow: hidden;
  background: radial-gradient(circle at 28% 22%, rgba(255,255,255,.65), transparent 55%), linear-gradient(160deg, hsl(var(--h) 62% 89%), hsl(var(--h) 42% 74%));
  color: hsl(var(--h) 45% 30%); }
.photo::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: 12%; height: 8%; border-radius: 50%; background: hsl(var(--h) 40% 30% / .18); filter: blur(3px); }
.photo i { position: relative; z-index: 1; }
.item .t { font-weight: 800; line-height: 1.25; }
.item .s { font-size: .78em; color: var(--ink-2); margin-top: 3px; }
.item .body { flex: 1; min-width: 0; }
.heart { color: var(--heart); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .7em; font-weight: 800; padding: 3px 10px; border-radius: 99px; margin-top: 7px; }
.pill i { font-size: 1.25em; }
.pill.free { background: var(--surface-2); color: var(--ink-2); }
.pill.taken { background: var(--pine-soft); color: var(--pine); }
.pill.mine { background: var(--accent-soft); color: var(--accent); }
.item.dim .photo, .item.dim .t { opacity: .55; }
.surprise { border: 2px dashed var(--gold); box-shadow: none; }

/* Bottom nav */
.nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px; width: min(528px, calc(100% - 32px));
  background: var(--surface); border-radius: 30px; box-shadow: var(--shadow), 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: space-around; padding: 8px; z-index: 5; }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72em; padding: 6px 0; color: var(--ink-2); border-radius: 20px; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 800; }
.nav .ico { font-size: 28px; line-height: 1; }
.nav .add { flex: none; width: 68px; height: 68px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 32px; margin-top: -30px;
  box-shadow: 0 8px 20px rgba(207,67,57,.4); display: grid; place-items: center; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(20,12,8,.42); z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 30px 30px 0 0; padding: 10px 18px 28px; }
.scrim.opening { animation: fade .2s ease both; } .scrim.opening .sheet { animation: up .3s cubic-bezier(.2,.9,.3,1.1) both; }
@media (min-width: 760px) { .scrim { align-items: center; } .sheet { border-radius: 30px; max-width: 520px; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 4px auto 14px; }
.photo.hero { width: 100%; height: 210px; border-radius: 24px; font-size: 110px; margin-bottom: 16px; }
.sheet h2 { font-size: 1.45em; }
.kv { color: var(--ink-2); font-size: .85em; margin: 6px 0 14px; }
.link { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; margin: 8px 0; font-size: .9em; }
.link i { font-size: 1.3em; }
.btn { width: 100%; min-height: 58px; border-radius: 18px; font-weight: 800; font-size: 1.02em; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn i { font-size: 1.3em; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.pine { background: var(--pine); color: #fff; }
:root[data-theme="dark"] .btn.pine { color: #10251B; }
.btn.ghost { background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }
.btn + .btn { margin-top: 10px; }
.status { border-radius: 18px; padding: 14px 16px; margin: 14px 0; font-size: .92em; display: flex; gap: 12px; align-items: center; }
.status > i { font-size: 1.6em; flex: none; }
.status.taken { background: var(--pine-soft); color: var(--pine); }
.status.mine { background: var(--accent-soft); color: var(--accent); }

/* Add sheet */
.for { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: none; }
.for button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .72em; width: 62px; }
.for .avatar { box-shadow: 0 0 0 3px transparent; transition: box-shadow .15s; }
.for button[aria-pressed="true"] .avatar { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent); }
.for button[aria-pressed="true"] { font-weight: 800; }
.field { width: 100%; border: 0; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; border-radius: 18px; padding: 16px; font-size: 1.05em; font-weight: 700; outline: none; }
.field:focus { box-shadow: 0 0 0 2px var(--accent) inset; }
.field.small { font-size: .92em; font-weight: 600; padding: 13px 14px; }
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.quick button { min-height: 76px; border-radius: 18px; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .85em; gap: 4px; }
.quick .ico { font-size: 30px; color: var(--accent); }
.cands { display: flex; gap: 10px; margin: 10px 0 4px; }
.cand { width: 84px; height: 84px; border-radius: 16px; font-size: 40px; }
.cand[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--accent); }
.cand.own { background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; font-size: .7em; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; }
.cand.own i { font-size: 26px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; border-radius: 18px; padding: 12px 16px; margin-top: 10px; min-height: 56px; width: 100%; }
.toggle .heart { font-size: 26px; opacity: .3; transition: transform .2s, opacity .2s; }
.toggle[aria-pressed="true"] .heart { opacity: 1; transform: scale(1.15); }
.shimmer { height: 84px; border-radius: 16px; background: linear-gradient(90deg, var(--surface-2), var(--surface), var(--surface-2)); background-size: 200% 100%; animation: sh 1s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
.hint { font-size: .75em; color: var(--ink-2); margin: 6px 4px 0; }
.secret { display: flex; align-items: center; gap: 8px; background: var(--gold-soft); color: var(--gold); border-radius: 14px; padding: 10px 14px; font-size: .8em; font-weight: 800; margin: 4px 0 12px; }
.secret i { font-size: 1.4em; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 14px 12px 18px; border-radius: 99px;
  display: flex; gap: 14px; align-items: center; z-index: 20; font-size: .88em; box-shadow: var(--shadow); animation: up .25s ease both; white-space: nowrap; }
.toast > span { display: inline-flex; align-items: center; gap: 8px; }
.toast i { font-size: 1.3em; }
.toast button { color: var(--accent); font-weight: 800; padding: 4px 8px; }
:root[data-theme="dark"] .toast button { color: #C0392B; }

/* Welcome */
.welcome { text-align: center; padding: 36px 8px 20px; }
.welcome-art { width: 240px; height: 150px; position: relative; margin: 0 auto; }
.welcome-art .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.welcome h1 { font-size: 2em; margin: 18px 0 8px; }
.welcome p { color: var(--ink-2); margin: 0 auto 26px; max-width: 340px; }
.steps { text-align: left; background: var(--surface); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); margin: 26px 0 0; font-size: .88em; }
.steps b:first-child { display: inline-flex; align-items: center; gap: 8px; }
.steps ol { margin: 8px 0 0; padding-left: 22px; } .steps li { margin: 6px 0; }
.welcome .lede { margin-bottom: 22px; }
.welcome .btn + .btn { margin-top: 10px; }
.screen.setup { padding-top: 22px; position: relative; }
.setup h1 { font-size: 1.6em; text-align: center; margin: 6px 0 4px; padding: 0 52px; }
.setup .seen { text-align: center; color: var(--ink-2); font-size: .85em; margin-bottom: 10px; }
.setup .chips { justify-content: center; }

/* Install step cards with drawn device pictures */
.isteps { display: grid; gap: 12px; margin: 6px 0 16px; text-align: left; }
.istep { display: flex; gap: 14px; align-items: center; background: var(--surface); border-radius: var(--radius); padding: 12px 14px 12px 12px; box-shadow: var(--shadow); }
.istep .n { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .9em; }
.istep .txt { flex: 1; line-height: 1.35; }
.istep .txt small { display: block; color: var(--ink-2); font-size: .8em; margin-top: 3px; }
.dev { --frame: color-mix(in srgb, var(--ink) 80%, transparent); width: 92px; height: 140px; flex: none; position: relative; overflow: hidden; border-radius: 16px;
  border: 3px solid var(--frame); background: var(--bg); font: 700 7.5px/1.2 Nunito, sans-serif; color: var(--ink); }
.dev.desk { width: 128px; height: 88px; border-radius: 8px; border-width: 2px; }
.dev .pg { position: absolute; inset: 14px 8px auto; display: grid; gap: 5px; }
.dev .pg i { display: block; height: 6px; border-radius: 3px; background: var(--surface-2); }
.dev .pg i:first-child { height: 26px; border-radius: 6px; background: var(--gold-soft); }
.dev .pg i.s { width: 60%; }
.dev .ph, .dev [class*="ph-"] { font-size: 11px; }
.dev .tb { position: absolute; left: 0; right: 0; bottom: 0; height: 24px; display: flex; justify-content: space-around; align-items: center; background: var(--surface); border-top: 1px solid var(--line); }
.dev .ihdr { position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: var(--surface); border-bottom: 1px solid var(--line); }
.dev .ihdr .url { flex: 1; font-weight: 600; color: var(--ink-2); overflow: hidden; white-space: nowrap; }
.dev.desk .ihdr .url { background: var(--surface-2); border-radius: 6px; padding: 2px 5px; }
.dev .ss { position: absolute; left: 0; right: 0; bottom: 0; top: 46%; background: var(--surface); border-radius: 10px 10px 0 0; box-shadow: 0 -2px 8px rgba(0,0,0,.12); padding: 8px 6px; display: grid; gap: 4px; align-content: start; }
.dev .ss { padding: 8px 4px; }
.dev .row { display: flex; align-items: center; gap: 3px; padding: 4px 3px; font-size: 6.5px; border-radius: 6px; background: var(--surface-2); white-space: nowrap; }
.dev .menu { position: absolute; right: 4px; top: 24px; width: 70px; background: var(--surface); border-radius: 6px; box-shadow: 0 2px 10px rgba(0,0,0,.2); padding: 4px; display: grid; gap: 3px; }
.dev .menu > * { padding: 4px 5px; border-radius: 4px; }
.dev .hdr { position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; justify-content: space-between; align-items: center; padding: 0 7px; background: var(--surface); }
.dev .hdr span { color: var(--ink-2); font-weight: 600; }
.dev .appicon { position: absolute; left: 50%; top: 40px; translate: -50% 0; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); }
.dev .appicon [class*="ph-"] { font-size: 20px; }
.dev .cap { position: absolute; left: 0; right: 0; top: 80px; text-align: center; }
.dev .dlg { position: absolute; left: 6px; right: 6px; top: 36%; background: var(--surface); border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.25); padding: 8px; display: grid; gap: 7px; }
.dev .dlg .btns { display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
.dev .dlg .btns span { color: var(--ink-2); }
.dev .code { position: absolute; left: 6px; right: 6px; top: 44px; text-align: center; background: var(--accent-soft); border-radius: 8px; padding: 7px 2px; font-size: 12px; letter-spacing: .06em; }
.dev .scrimmy { position: absolute; inset: 0; background: rgba(20,12,8,.28); }
.dev .hot { position: relative; z-index: 1; color: var(--accent); }
.dev .hot::after { content: ""; position: absolute; inset: -4px; border-radius: 99px; border: 2px solid var(--accent); animation: ping 1.6s ease-out infinite; }
.dev .row.hot, .dev .menu .hot { background: var(--accent-soft); }
.dev .row.hot::after, .dev .menu .hot::after { border-radius: 8px; inset: -2px; }
@keyframes ping { 0% { opacity: .9; transform: scale(.9); } 80%, 100% { opacity: 0; transform: scale(1.25); } }
@media (prefers-reduced-motion: reduce) { .dev .hot::after { animation: none; } }

.card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); text-align: left; margin: 16px 0; }
.card h3 { font-size: 1.1em; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.card p { margin: 0 0 12px; color: var(--ink-2); font-size: .88em; max-width: none; }
.card.qr-card { display: flex; gap: 16px; align-items: center; }
.card.qr-card p { margin: 0; }
.qr { background: #fff; border-radius: 12px; padding: 8px; flex: none; display: block; }
.qr svg { display: block; }
.codein { display: flex; gap: 8px; justify-content: center; margin: 4px 0 16px; }
.codein input { width: 44px; height: 58px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; text-align: center; font: 800 1.5em Nunito, sans-serif; color: var(--ink); outline: none; }
.codein input:focus { box-shadow: 0 0 0 2px var(--accent) inset; }
.codein .gap { width: 6px; }
.textlink { color: var(--ink-2); font-size: .85em; text-decoration: underline; text-underline-offset: 3px; margin-top: 14px; display: inline-block; }
.mockonly { display: block; margin: 18px auto 0; font-size: .75em; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 99px; padding: 6px 12px; }

/* System install prompt (stand-in for the browser's own) */
.sys { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; animation: fade .15s ease both; }
.sys .box { background: #fff; color: #1f1f1f; width: min(340px, 100%); border-radius: 24px; padding: 22px; font-family: Roboto, "Segoe UI", system-ui, sans-serif; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.sys .box h4 { margin: 0 0 14px; font-size: 1.15em; font-weight: 500; }

.sys.share { place-items: end center; padding: 0; }
.sys.share .box { width: min(560px, 100%); border-radius: 22px 22px 0 0; padding: 16px 16px 22px; animation: up .25s ease both; }
.sys .shead { display: flex; gap: 12px; align-items: center; font-size: .9em; padding-bottom: 14px; border-bottom: 1px solid #e5e5e5; }

.sys .cancel { width: 100%; padding: 12px; border-radius: 14px; background: #f0f0f0; color: #0b57d0; font-weight: 600; }
.msg { font-weight: 500; font-size: .85em; line-height: 1.45; resize: vertical; margin-top: 10px; }

/* Organizer: people and invites */
.prows { display: grid; gap: 10px; }

/* ---------- Banner scenes ----------
   Each scene is a list of layers in a shared 400 x 150 space, content kept on the right.
   A layer pins to the top or bottom of the banner and has a depth for parallax
   (0 = far away and barely moves, 1 = nearest and moves most). */
const L = (depth, pin, content) => ({ depth, pin, content });
function layers(list, { vb = '0 0 400 150', x = 'xMax' } = {}) {
  return list.map(l => `<svg class="scene" data-depth="${l.depth}" viewBox="${vb}" preserveAspectRatio="${x}${l.pin === 'top' ? 'YMin' : 'YMax'} meet" aria-hidden="true">${l.content}</svg>`).join('');
}

function star(cx, cy, R, r) {
  let d = '';
  for (let k = 0; k < 10; k++) {
    const a = (-90 + k * 36) * Math.PI / 180, rad = k % 2 ? r : R;
    d += (k ? 'L' : 'M') + (cx + rad * Math.cos(a)).toFixed(2) + ' ' + (cy + rad * Math.sin(a)).toFixed(2);
  }
  return d + 'Z';
}
const spark = (x, y, s) => `M${x} ${y - s}Q${x} ${y} ${x + s} ${y}Q${x} ${y} ${x} ${y + s}Q${x} ${y} ${x - s} ${y}Q${x} ${y} ${x} ${y - s}Z`;

function gift(x, y, w, h, body, ribbon, { open = false } = {}) {

  const lid = `<rect x="${x - 3}" y="${y - lidH + 2}" width="${w + 6}" height="${lidH}" rx="5" fill="${body}"/>
    <rect x="${mid - 4}" y="${y - lidH + 2}" width="8" height="${lidH}" fill="${ribbon}"/>
    <ellipse cx="${mid - 8}" cy="${y - lidH}" rx="9" ry="5.5" transform="rotate(-20 ${mid - 8} ${y - lidH})" fill="${ribbon}"/>
    <ellipse cx="${mid + 8}" cy="${y - lidH}" rx="9" ry="5.5" transform="rotate(20 ${mid + 8} ${y - lidH})" fill="${ribbon}"/>`;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${body}"/>
    <rect x="${mid - 4}" y="${y}" width="8" height="${h}" fill="${ribbon}"/>
    ${open ? `<rect x="${x}" y="${y}" width="${w}" height="7" fill="#000" opacity=".12"/>
      <g transform="rotate(-22 ${x} ${y - 6}) translate(-6 -16)">${lid}</g>` : `<rect x="${x}" y="${y}" width="${w}" height="5" fill="#000" opacity=".1"/>${lid}`}`;
}

/* Parallax: layers drift by depth with the pointer, phone tilt (Android) and scroll. */
const parallax = { px: 0, py: 0, tx: 0, ty: 0, raf: 0 };
const calm = matchMedia('(prefers-reduced-motion: reduce)');
function tick() {
  parallax.raf = 0;
  parallax.px += (parallax.tx - parallax.px) * .12;
  parallax.py += (parallax.ty - parallax.py) * .12;
  const scroll = Math.min(window.scrollY, 300);
  document.querySelectorAll('.banner .scene, .welcome-art .scene').forEach(el => {
    const d = +el.dataset.depth;
    el.style.transform = calm.matches ? '' :
      `translate3d(${(parallax.px * d * 10).toFixed(2)}px, ${(parallax.py * d * 6 + scroll * (1 - d) * .25).toFixed(2)}px, 0)`;
  });
  if (Math.abs(parallax.tx - parallax.px) > .01 || Math.abs(parallax.ty - parallax.py) > .01) parallax.raf = requestAnimationFrame(tick);
}
const nudge = () => { if (!parallax.raf) parallax.raf = requestAnimationFrame(tick); };
const clamp = v => Math.max(-1, Math.min(1, v));
window.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse') return;
  parallax.tx = clamp(e.clientX / innerWidth * 2 - 1); parallax.ty = clamp(e.clientY / innerHeight * 2 - 1); nudge();
});
window.addEventListener('deviceorientation', e => {
  if (e.gamma == null) return;
  parallax.tx = clamp(e.gamma / 25); parallax.ty = clamp((e.beta - 45) / 25); nudge();
});
window.addEventListener('scroll', nudge, { passive: true });

function banner() {
  const lily = P('lily');
  const go = t => `<span class="go">${t} ${ic('caret-right', 'bold')}</span>`;
  const box = (cls, scene, text, attrs = '') => attrs
    ? `<button class="banner ${cls}" ${attrs}>${layers(scene)}<span class="btext">${text}</span></button>`
    : `<div class="banner ${cls}">${layers(scene)}<div class="btext">${text}</div></div>`;
  switch (S.banner) {
    case 'xmas': return box('b-xmas', sceneXmas(false),
      `<span class="big">37</span><strong>days until Christmas</strong><span class="small">3 people have new ideas on their lists</span>`);

// A stand-in QR code: real finder squares, random middle.
function qr(seed = 7, px = 132) {
  const N = 25, cell = px / N; let s = seed, out = '';
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
  const ring = (x, y, ox, oy) => { const a = x - ox, b = y - oy; return a >= 0 && a < 7 && b >= 0 && b < 7 && (a === 0 || a === 6 || b === 0 || b === 6 || (a > 1 && a < 5 && b > 1 && b < 5)); };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const on = finder(x, y) ? ring(x, y, 0, 0) || ring(x, y, N - 7, 0) || ring(x, y, 0, N - 7) : rnd() > .52;
    if (on) out += `<rect x="${(x * cell).toFixed(2)}" y="${(y * cell).toFixed(2)}" width="${(cell + .3).toFixed(2)}" height="${(cell + .3).toFixed(2)}"/>`;
  }
  return `<span class="qr"><svg width="${px}" height="${px}" viewBox="0 0 ${px} ${px}" fill="#2A1D17" role="img" aria-label="QR code">${out}</svg></span>`;
}

  else if (!i.claim) action = `<button class="btn primary" data-claim="${i.id}">${ic('hand-heart', 'fill')} I'll get this</button>`;
  else if (i.claim === 'You') action = `<div class="status mine">${ic(i.bought ? 'check-circle' : 'hand-heart', 'fill')}<span>${i.bought ? 'You bought this. It stays hidden from ' + P(S.person).name + '.' : 'You’re getting this. ' + P(S.person).name + ' won’t see that.'}</span></div>
      ${i.bought ? '' : `<button class="btn pine" data-bought="${i.id}">${ic('check', 'bold')} I bought it</button>`}
      <button class="btn ghost" data-unclaim="${i.id}">Never mind</button>`;
  else action = `<div class="status taken">${ic(i.bought ? 'check-circle' : 'hand-heart', 'fill')}<span><b>${esc(i.claim)}</b> ${i.bought ? 'already bought this.' : 'is getting this.'}</span></div><button class="btn ghost" data-close>Close</button>`;
  return `<div class="grab"></div>
    ${photo(i, 'hero')}
    <h2>${esc(i.title)} ${i.heart ? heartMark() : ''}</h2>
    <div class="kv">${[i.price, i.store].filter(Boolean).map(esc).join(' · ')}${i.heart ? ' · <b class="heart">Really wants this</b>' : ''}</div>
    ${i.notes ? `<div class="note">${ic('note-pencil')}<span>${esc(i.notes)}</span></div>` : ''}
    ${i.store && !i.surprise && !owner ? `<a class="link" href="#" onclick="return false">${ic('link-simple')}<span style="flex:1">View at ${esc(i.store.replace('Seen at ', '').replace('Photo from ', ''))}</span>${ic('caret-right', 'bold')}</a>` : ''}
    ${action}`;
}

const CANDS = [{ icon: 'wind', h: 195 }, { icon: 'package', h: 40 }, { icon: 'shopping-cart', h: 0 }];

function addSheet() {
  const a = S.add;
  const forP = P(a.for);
  const isMe = a.for === 'me';
  let mid = '';
  if (a.stage === 'loading') mid = `<div class="cands"><div class="shimmer" style="flex:1"></div></div><div class="hint">Looking up the link…</div>`;
  else if (a.stage === 'filled') mid = `<div class="hint" style="margin-top:10px">Pick the right picture</div>
    <div class="cands">${CANDS.map((c, n) => `<button class="photo cand" style="--h:${c.h}" data-cand="${n}" aria-pressed="${a.cand === n}" aria-label="Picture ${n + 1}">${ic(c.icon)}</button>`).join('')}
      <button class="cand own" data-cand="own">${ic('camera')}My photo</button></div>`;
  else if (a.stage === 'photo') mid = `<div class="cands"><span class="photo" style="--h:30;width:100%;height:150px;font-size:70px">${ic('image')}</span></div><div class="hint">Photo added. Tap to retake.</div>`;
  else mid = `<div class="quick"><button data-photo>${ic('camera', 'duotone', 'ico')}Take a photo</button><button data-paste>${ic('link-simple', 'duotone', 'ico')}Paste a link</button></div>`;
  return `<div class="grab"></div>
    <h2 style="margin-bottom:10px">${isMe ? 'Add to my list' : 'Secret idea for ' + esc(forP.name)}</h2>
    <div class="for" role="group" aria-label="Who is it for">
      ${people.map(p => `<button data-for="${p.id}" aria-pressed="${a.for === p.id}">${avatar(p, 'sm')}${p.id === 'me' ? 'Me' : esc(p.name)}</button>`).join('')}
    </div>
    ${isMe ? '' : `<div class="secret">${ic('eye-slash')} ${esc(forP.name)} won't see this. Everyone else will.</div>`}
    <input class="field" id="title" placeholder="What is it?" value="${esc(a.title || '')}" autocomplete="off">
    ${mid}
    ${a.stage === 'empty' ? '' : `<div class="two"><input class="field small" placeholder="Price" value="${esc(a.price || '')}"><input class="field small" placeholder="Where? (optional)" value="${esc(a.store || '')}"></div>`}
    <input class="field small" style="margin-top:10px" placeholder="Notes: size, color…">
    <button class="toggle" data-heart aria-pressed="${!!a.heart}"><span>${isMe ? 'I really want this' : 'They’d really love this'}</span><span class="heart">${ic('heart', 'fill')}</span></button>
    <button class="btn primary" style="margin-top:16px" data-save>Save</button>`;
}

function renderSheet() {
  if (!S.sheet) { $layer.innerHTML = ''; $layer.dataset.kind = ''; return; }
  let inner;
  if (S.sheet.type === 'item') { const [i, k] = findItem(S.sheet.id); inner = itemSheet(i, k === 'mine' || k === 'received'); }
  else if (S.sheet.type === 'invite') inner = inviteSheet();
  else inner = addSheet();
  const existing = $layer.querySelector('.sheet');
  if (existing && $layer.dataset.kind === S.sheet.type + (S.sheet.id || '')) { existing.innerHTML = inner; existing.scrollTop = 0; return; }
  $layer.dataset.kind = S.sheet.type + (S.sheet.id || '');
  document.querySelector('.toast')?.remove();
  $layer.innerHTML = `<div class="scrim opening" data-scrim><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
}

let toastTimer;
function toast(html, undo) {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = `<span>${html}</span>${undo ? '<button>Undo</button>' : ''}`;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.remove(); render(); };
  document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4000);
}

document.getElementById('bannerDemo').addEventListener('change', e => {
  S.banner = e.target.value; S.screen = 'home'; S.sheet = null; render();
});
document.getElementById('deviceDemo').addEventListener('change', e => {
  S.wel = { step: 'hi', device: e.target.value }; render();
});
// Code entry: move along as digits are typed; six digits signs you in
document.addEventListener('input', e => {
  const t = e.target; if (t.dataset.digit === undefined) return;
  t.value = t.value.replace(/\D/g, '').slice(-1);
  const all = [...document.querySelectorAll('[data-digit]')];
  if (t.value) all[+t.dataset.digit + 1]?.focus();
  if (all.every(i => i.value)) setTimeout(() => { S.wel.step = 'done'; render(); }, 250);
});

document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-scrim]');
  if (!t) return;
  const d = t.dataset;

  if (d.demo) {
    if (d.demo === 'theme') {
      const r = document.documentElement;
      const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      r.dataset.theme = dark ? 'light' : 'dark';
    } else if (d.demo === 'large') { document.documentElement.classList.toggle('large'); t.setAttribute('aria-pressed', document.documentElement.classList.contains('large')); }
    else if (d.demo === 'reset') { S = fresh(); }
    else { S.screen = d.demo; S.sheet = null; if (d.demo === 'welcome') S.wel.step = 'hi'; }
    render(); return;
  }
  // Welcome and install
  if (d.sys) {
    if (d.sys === 'no' && t.classList.contains('sys') && e.target !== t) return; // click inside the box
    document.querySelector('.sys')?.remove();
    if (d.sys === 'yes') { S.wel.step = 'done'; render(); toast(`${ic('check-circle', 'fill')} Installed`); }
    if (d.sys.startsWith('sent:')) {
      const app = d.sys.slice(5);
      S.join[S.sheet.id] = 'sent'; S.sheet = null; render();
      toast(`${ic('paper-plane-tilt', 'fill')} Opening ${esc(app)}…`);
    }
    return;
  }
  if (d.share !== undefined) { sysShare(); return; }
  if (d.wel) { S.wel.step = d.wel; window.scrollTo(0, 0); render(); return; }
  if (d.dev) { S.wel.device = d.dev; render(); return; }
  if (d.install !== undefined) { sysInstall(); return; }
  if (d.welDone !== undefined) { S.wel.step = 'done'; render(); return; }
  if (d.welFirst !== undefined) {
    S.screen = 'home'; S.wel.step = 'hi'; render();
    S.add = { for: 'me', stage: 'empty', title: '' }; S.sheet = { type: 'add' }; renderSheet(); return;
  }
  // Invites
  if (d.invite) { S.sheet = { type: 'invite', id: d.invite, stage: 'pick' }; renderSheet(); return; }
  if (d.inv) { S.sheet.stage = d.inv; renderSheet(); return; }
  if (d.sent) {
    const id = S.sheet.id, f = first(P(id));
    S.join[id] = d.sent === 'qr' ? 'joined' : 'sent'; S.sheet = null; render();
    toast({ copy: `${ic('copy', 'fill')} Invite copied. Paste it anywhere`, qr: `${ic('check-circle', 'fill')} ${esc(f)} has joined` }[d.sent]);
    return;
  }
  if (d.scrim !== undefined && e.target === t) { S.sheet = null; renderSheet(); return; }
  if (d.close !== undefined) { S.sheet = null; renderSheet(); return; }
  if (d.received !== undefined) { S.screen = 'mine'; S.openReceived = true; window.scrollTo(0, 0); render(); return; }
  if (d.go) { S.screen = d.go; S.sheet = null; S.openReceived = false; window.scrollTo(0, 0); render(); return; }
  if (d.filter) { S.filter = d.filter; render(); return; }
  if (d.person) { S.screen = 'person'; S.person = d.person; P(d.person).isNew = false; window.scrollTo(0, 0); render(); return; }
  if (d.item) { S.sheet = { type: 'item', id: d.item }; renderSheet(); return; }
  if (d.add !== undefined) {
    S.add = { for: d.add || 'me', stage: 'empty', title: '' };
    S.sheet = { type: 'add' }; renderSheet(); setTimeout(() => document.getElementById('title')?.focus(), 320); return;
  }
  if (d.claim) {
    const [i] = findItem(d.claim); i.claim = 'You';
    S.sheet = null; render();
    toast(`${ic('hand-heart', 'fill')} You're getting the ${esc(i.title.split(' (')[0])}`, () => { i.claim = null; });
    return;
  }
  if (d.unclaim) { const [i] = findItem(d.unclaim); i.claim = null; i.bought = false; S.sheet = null; render(); toast('Back on the list for others'); return; }
  if (d.bought) { const [i] = findItem(d.bought); i.bought = true; renderSheet(); render(); toast(`${ic('check-circle', 'fill')} Marked as bought`, () => { i.bought = false; }); return; }

  if (S.sheet?.type === 'add') {
    const a = S.add;
    a.title = document.getElementById('title')?.value ?? a.title;
    if (d.for) { a.for = d.for; renderSheet(); return; }
    if (d.paste !== undefined) {
      a.stage = 'loading'; renderSheet();
      setTimeout(() => { Object.assign(a, { stage: 'filled', title: 'Rainbow stunt kite', price: '$34.99', store: 'Amazon', cand: 0 }); renderSheet(); }, 1100);
      return;
    }
    if (d.photo !== undefined) { a.stage = 'photo'; a.store = a.store || 'Seen at Target'; renderSheet(); setTimeout(() => document.getElementById('title')?.focus(), 50); return; }
    if (d.cand !== undefined) { a.cand = d.cand === 'own' ? 'own' : +d.cand; if (d.cand === 'own') a.stage = 'photo'; renderSheet(); return; }
    if (d.heart !== undefined) { a.heart = !a.heart; renderSheet(); return; }
    if (d.save !== undefined) {
      const title = a.title.trim() || 'Something nice';
      const look = a.stage === 'photo' || a.cand === 'own' ? { icon: 'image', h: 30 } : a.stage === 'filled' ? CANDS[a.cand] : { icon: 'gift', h: 5 };
      const item = { id: 'n' + Date.now(), title, ...look, price: a.price || '', store: a.store || '', heart: a.heart, claim: null };
      if (a.for === 'me') { S.data.mine.unshift(item); S.sheet = null; S.screen = 'mine'; render(); toast(`${ic('gift', 'fill')} Added to your list`, () => S.data.mine.shift()); }
      else {
        item.surprise = true; item.store = 'Your secret idea';
        (S.data.ideas[a.for] ||= []).unshift(item);
        S.sheet = null; S.screen = 'person'; S.person = a.for; render();
        toast(`${ic('eye-slash')} Secret idea added for ${esc(P(a.for).name)}`);
      }
      return;
    }
  }
});

render();
</script>
</body>
</html>
