name: Deploy to GitHub Pages

# Every push to main goes live. It can also be run by hand from the Actions tab
# (for example after tagging a new Android helper, so the site picks up the new APK).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # The helpers, downloadable from the site itself (the repo is private, so its
      # release files need a GitHub login; the site doesn't).
      - name: Helpers for download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/dist/downloads
          node tools/build-extension.mjs "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          cp dist/family-wish-lists-extension-*.zip app/dist/downloads/wish-list-extension.zip
          gh release download --repo "${{ github.repository }}" --pattern 'wish-list-helper.apk' --dir app/dist/downloads             || echo "No Android helper release yet (tag android-v0.1.0 to make one)."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
